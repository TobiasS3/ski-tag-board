<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ski Tag">
<title>Fragen · Ski Tag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=1793379434">
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main" hidden>
    <section class="panel">
      <h2>Frage stellen</h2>
      <form class="add" id="f-q">
        <div class="row" id="q-row">
          <input type="text" id="q-title" class="grow" style="flex:3 1 260px" placeholder="Deine Frage, z. B. „Geht in der App eine SOS-Bestätigung?“" required aria-label="Frage">
          <select id="q-to" class="grow" aria-label="An wen"></select>
          <button class="btn" type="submit">Fragen</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>An dich</h2>
      <div id="to-me"></div>
    </section>

    <section class="panel">
      <h2>Andere offene Fragen</h2>
      <div id="others"></div>
      <details class="more" id="settled-box" hidden>
        <summary id="settled-sum">Geklärte Fragen</summary>
        <div id="settled"></div>
      </details>
    </section>
  </main>
</div>
<script src="app.js?v=1793379434"></script>
<script>
const drafts = {}, opened = new Set(), pickers = {}; // Bilder pro Frage bleiben beim Neuzeichnen erhalten
const askPick = imagePicker();
let editing = null; // welche Frage oder Antwort gerade bearbeitet wird
let asking = null; // bei welcher Antwort gerade „Wirklich löschen?“ offen ist

// Eigene Antwort löschen: erst nachfragen, danach noch „Rückgängig“ (legt den Text neu an)
function deleteAnswerButton(q, c) {
  if (asking !== c.id) return h("button", { class: "link danger small", type: "button", onclick: () => { asking = c.id; render(); } }, "Löschen");
  return h("span", { class: "row small" }, h("span", { class: "confirm-q" }, "Wirklich löschen?"),
    h("button", { class: "btn danger small", type: "button", onclick: () => act(async () => {
      const body = c.body;
      await deleteAnswer(c.id); asking = null; await SK.refresh();
      return () => answerQuestion(q, body);
    }, "Antwort gelöscht.") }, "Ja, löschen"),
    h("button", { class: "btn ghost small", type: "button", onclick: () => { asking = null; render(); } }, "Nein"));
}

function startEdit(id) { editing = id; delete drafts["e-" + id]; render(); }
const editLink = (id) => h("button", { class: "link small", type: "button", onclick: () => startEdit(id) }, "bearbeiten");
const editedMark = (iso) => iso ? h("span", { class: "muted", title: "zuletzt geändert am " + dateOf(iso) + " um " + timeOf(iso) }, "(geändert)") : null;
// „save“ speichert den neuen Text und gibt zurück, wie man das wieder rückgängig macht
function editForm(id, text, label, save, mayBeEmpty) {
  const ta = h("textarea", { id: "e-" + id, "aria-label": label });
  ta.value = drafts[ta.id] ?? text;
  return h("form", { class: "add", onsubmit: (ev) => {
    ev.preventDefault(); const next = ta.value.trim(); if (!next && !mayBeEmpty) return;
    act(async () => { const undo = await save(next); editing = null; await SK.refresh(); return undo; }, "Geändert.");
  } }, ta, h("div", { class: "row" },
    h("button", { class: "btn", type: "submit" }, "Speichern"),
    h("button", { class: "btn ghost", type: "button", onclick: () => { editing = null; render(); } }, "Abbrechen")));
}

function questionRow(q) {
  const me = SK.me.login, to = recipientOf(q), settled = isSettled(q), body = bodyWithoutRecipient(q.body);
  const answers = q.comments.nodes;
  const byOther = (a, iso) => a && a.login !== me && isNew(iso);
  const fresh = byOther(q.author, q.createdAt) || answers.some(c => byOther(c.author, c.createdAt));
  const row = h("details", { class: "qrow" + (settled ? " settled" : ""), id: "q" + q.number, open: opened.has(q.number) || null,
    ontoggle: (e) => e.target.open ? opened.add(q.number) : opened.delete(q.number) },
    h("summary", {}, av(q.author),
      h("div", {}, h("div", { class: "q-title" }, cleanTitle(q.title)),
        h("div", { class: "q-meta" }, firstName(q.author && q.author.login) + " → " + (to ? (to === me ? "dich" : firstName(to)) : "alle") + " · " + ago(q.createdAt) +
          " · " + (answers.length === 1 ? "1 Antwort" : answers.length + " Antworten"),
          fresh && !settled ? h("span", { class: "pill new", style: "margin-left:8px" }, "neu") : null,
          q.closed && byOther(q.author, q.closedAt) ? h("span", { class: "pill new", style: "margin-left:8px" }, "gerade geklärt") : null)),
      h("span", { class: "arrow", "aria-hidden": "true" }, "›")));
  const inner = h("div", { class: "q-inner" });
  // Geklärt, wieder öffnen und die Frage ändern darf nur, wer sie gestellt hat; alle anderen können nur antworten
  const isAsker = !!q.author && q.author.login === me;
  if (isAsker) inner.append(editing === q.id
    ? editForm(q.id, cleanTitle(q.title), "Frage bearbeiten", async (next) => {
        const before = q.title, tag = (/^\[[^\]]+\]\s*/.exec(before) || [""])[0];
        await editQuestion(q, tag + next.replace(/\s+/g, " "));
        return () => editQuestion(q, before);
      })
    : h("div", { class: "row small" }, h("button", { class: "link small", type: "button", onclick: () => startEdit(q.id) }, "Frage bearbeiten"), editedMark(q.lastEditedAt)));
  const { text: bodyText, images: bodyImages } = splitChat(body);
  if (bodyText && bodyText !== "(keine Details)") inner.append(h("div", { class: "body muted" }, bodyText));
  for (const p of bodyImages) inner.append(chatImage(p));
  for (const c of answers) {
    const own = c.author && c.author.login === me, { text: answerText, images } = splitChat(c.body);
    inner.append(h("div", { class: "cmt" }, av(c.author), h("div", {},
      h("div", { class: "row small" }, h("b", {}, firstName(c.author && c.author.login)), h("span", { class: "muted" }, ago(c.createdAt)),
        editedMark(c.lastEditedAt),
        byOther(c.author, c.createdAt) ? h("span", { class: "pill new" }, "neu") : null,
        own && editing !== c.id ? editLink(c.id) : null,
        own && editing !== c.id ? deleteAnswerButton(q, c) : null),
      own && editing === c.id
        ? editForm(c.id, answerText, "Antwort bearbeiten", async (next) => { const before = c.body; await editAnswer(c.id, joinChat(next, images)); return () => editAnswer(c.id, before); }, !!images.length)
        : answerText ? h("p", {}, answerText) : null, images.map(p => chatImage(p)))));
  }
  if (settled) {
    if (isAsker) inner.append(h("div", {}, h("button", { class: "link", type: "button", onclick: () => act(async () => { await settleQuestion(q, false); await SK.refresh(); return () => settleQuestion(q, true); }, "Wieder offen.") }, "wieder öffnen")));
  } else {
    const ta = h("textarea", { id: "a-" + q.number, placeholder: "Antwort schreiben …", "aria-label": "Antwort" });
    const pick = pickers[q.number] = pickers[q.number] || imagePicker();
    ta.value = drafts[ta.id] || "";
    const answerForm = h("form", { class: "add", onsubmit: (ev) => {
      ev.preventDefault(); const text = ta.value.trim(); if (!text && !pick.has()) return;
      // Feld leeren, bevor neu gezeichnet wird: render() merkt sich sonst den gesendeten Text wieder als Entwurf
      act(async () => { const id = await answerQuestion(q, joinChat(text, await pick.upload())); ta.value = ""; delete drafts[ta.id]; pick.clear(); await SK.refresh(); return () => deleteAnswer(id); }, "Antwort gespeichert.");
    } }, pick.box, ta, h("div", { class: "row" },
      h("button", { class: "btn", type: "submit" }, "Antworten"),
      pick.button, pick.file,
      isAsker ? h("button", { class: "btn ghost", type: "button", onclick: () => act(async () => { await settleQuestion(q, true); ta.value = ""; delete drafts[ta.id]; opened.delete(q.number); await SK.refresh(); return () => settleQuestion(q, false); }, "Als geklärt markiert.") }, "✓ Geklärt") : null));
    pick.watch(answerForm);
    inner.append(answerForm);
  }
  row.append(inner);
  return row;
}

function render() {
  const me = SK.me.login;
  document.querySelectorAll("main textarea").forEach(t => drafts[t.id] = t.value);
  if (!SK.data.qa) return $("others").replaceChildren(h("p", { class: "empty" }, "Im Repo fehlt der Q&A-Bereich der Discussions."));
  const byNew = (a, b) => b.createdAt.localeCompare(a.createdAt);
  const open = SK.data.questions.filter(q => !isSettled(q)).sort(byNew);
  const mine = open.filter(q => recipientOf(q) === me), rest = open.filter(q => recipientOf(q) !== me);
  const settled = SK.data.questions.filter(isSettled).sort(byNew);
  $("to-me").replaceChildren(...(mine.length ? mine.map(questionRow) : [h("p", { class: "empty" }, "Niemand hat dich gerade etwas gefragt.")]));
  $("others").replaceChildren(...(rest.length ? rest.map(questionRow) : [h("p", { class: "empty" }, "Keine anderen offenen Fragen.")]));
  $("settled-box").hidden = !settled.length;
  $("settled-sum").textContent = "Geklärte Fragen (" + settled.length + ")";
  $("settled").replaceChildren(...settled.map(questionRow));
  if (location.hash && !render.jumped) {
    const el = document.querySelector(location.hash);
    if (el) { el.open = true; opened.add(Number(location.hash.slice(2))); if (el.closest("#settled")) $("settled-box").open = true; el.scrollIntoView(); render.jumped = true; }
  }
}

$("q-row").append(askPick.button, askPick.file); $("f-q").prepend(askPick.box); askPick.watch($("f-q"));
$("f-q").addEventListener("submit", (ev) => {
  ev.preventDefault(); const t = $("q-title").value.trim(); if (!t) return;
  act(async () => { const id = await askQuestion(null, $("q-to").value, t, joinChat("", await askPick.upload())); $("q-title").value = ""; askPick.clear(); await SK.refresh(); return () => deleteQuestion(id); }, "Frage gestellt.");
});

startPage("fragen", [], async () => {
  peopleOptions($("q-to"), "An alle");
  render();
});
</script>
</body>
</html>
