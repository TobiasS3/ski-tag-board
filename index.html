<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ski Tag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=1793287312">
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main" hidden>
    <section class="panel">
      <h2>Neue Aufgabe</h2>
      <form class="row" id="f-task">
        <input type="text" id="t-title" class="grow" style="flex:3 1 240px" placeholder="Was ist zu tun?" required aria-label="Aufgabe">
        <select id="t-who" class="grow" aria-label="Wer"></select>
        <select id="t-phase" class="grow" aria-label="Phase"></select>
        <button class="btn" type="submit">Hinzufügen</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Meine Aufgaben</h2><span class="muted small" id="mine-count"></span></div>
      <div id="mine"></div>
      <details class="more" id="done-box" hidden>
        <summary id="done-sum">Erledigt</summary>
        <div id="done"></div>
      </details>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Aufgaben der anderen</h2><span class="muted small" id="others-count"></span></div>
      <div class="row">
        <select id="f-who" class="grow" aria-label="Wessen Aufgaben"></select>
        <select id="f-state" class="grow" aria-label="Status">
          <option value="open" selected>Offen</option>
          <option value="closed">Erledigt</option>
          <option value="all">Alle</option>
        </select>
      </div>
      <div id="others"></div>
    </section>

    <section class="panel" id="deleted-box" hidden>
      <details class="more">
        <summary id="deleted-sum">Gelöscht</summary>
        <p class="muted small">Wiederherstellen holt die Aufgabe zurück, ohne Zuständigen. Dann kann sie jeder übernehmen.</p>
        <div id="deleted"></div>
      </details>
    </section>
  </main>
</div>
<script src="app.js?v=1793287312"></script>
<script>
const byEnd = (a, b) => ((taskRange(a) || {}).end || 9e15) - ((taskRange(b) || {}).end || 9e15);

function render() {
  const me = SK.me.login, is = SK.data.issues;
  const open = is.filter(i => i.state === "open"), done = is.filter(i => i.state === "closed" && isMine(i));
  const mine = open.filter(isMine).sort(byEnd);
  $("mine-count").textContent = mine.length ? mine.length + " offen" : "";
  $("mine").replaceChildren(...(mine.length ? mine.map(i => taskRow(i)) : [h("p", { class: "empty" }, "Du hast gerade keine offenen Aufgaben.")]));

  renderOthers();
  renderDeleted();

  $("done-box").hidden = !done.length;
  $("done-sum").textContent = "Erledigt (" + done.length + ")";
  $("done").replaceChildren(...done.sort((a, b) => String(b.closed_at).localeCompare(String(a.closed_at))).map(i => taskRow(i)));

  peopleOptions($("t-who"), "Niemand");
  if (!$("t-who").dataset.init) { $("t-who").value = me; $("t-who").dataset.init = "1"; }
  const ph = $("t-phase"), keep = ph.value;
  ph.replaceChildren(...SK.data.milestones.map(m => h("option", { value: m.number }, m.title)));
  if (keep) ph.value = keep;
}

function renderOthers() {
  const me = SK.me.login, who = $("f-who"), keep = who.value;
  who.replaceChildren(h("option", { value: "" }, "Alle anderen"),
    ...SK.data.people.filter(p => p.login !== me).map(p => h("option", { value: p.login }, nameOf(p.login))),
    h("option", { value: "-" }, "Noch niemand zuständig"));
  who.value = keep;
  const st = $("f-state").value;
  let list = SK.data.issues.filter(i => !isMine(i));
  if (who.value === "-") list = list.filter(isFree);
  else if (who.value) list = list.filter(i => (i.assignees || []).some(a => a.login === who.value));
  if (st !== "all") list = list.filter(i => i.state === st);
  list.sort((a, b) => (a.state === "closed") - (b.state === "closed") || byEnd(a, b));
  $("others-count").textContent = list.length === 1 ? "1 Aufgabe" : list.length + " Aufgaben";
  // bei „Alle anderen“ nach Person gruppieren
  const parts = [];
  if (!who.value) {
    for (const p of SK.data.people.filter(p => p.login !== me)) {
      const l = list.filter(i => (i.assignees || []).some(a => a.login === p.login));
      if (l.length) parts.push(h("h3", {}, nameOf(p.login)), h("div", {}, ...l.map(i => taskRow(i))));
    }
    const f = list.filter(isFree);
    if (f.length) parts.push(h("h3", {}, "Noch niemand zuständig"), h("div", {}, ...f.map(i => taskRow(i))));
  } else parts.push(...list.map(i => taskRow(i)));
  $("others").replaceChildren(...(parts.length ? parts : [h("p", { class: "empty" }, "Keine Aufgaben für diese Auswahl.")]));
}

function renderDeleted() {
  const list = [...(SK.data.deleted || [])].sort((a, b) => String(b.closed_at).localeCompare(String(a.closed_at)));
  $("deleted-box").hidden = !list.length;
  $("deleted-sum").textContent = "Gelöscht (" + list.length + ")";
  $("deleted").replaceChildren(...list.map(i => h("div", { class: "task" },
    h("span"),
    h("div", {}, h("span", { class: "t muted" }, i.title), h("div", { class: "sub" }, chip(areaOfIssue(i)), h("span", {}, "gelöscht am " + dateOf(i.closed_at)))),
    h("button", { class: "btn ghost small", type: "button", onclick: () => act(async () => {
      await restoreTask(i); await SK.refresh(); return () => dropTask(i.number);
    }, "Wiederhergestellt. Steht jetzt bei „Noch niemand zuständig“.") }, "Wiederherstellen"))));
}

$("f-who").addEventListener("change", renderOthers);
$("f-state").addEventListener("change", renderOthers);

$("f-task").addEventListener("submit", (ev) => {
  ev.preventDefault(); const title = $("t-title").value.trim(); if (!title) return;
  const who = $("t-who").value;
  const body = { title, labels: [CFG.areaOf[who] || "plan"] };
  if ($("t-phase").value) body.milestone = Number($("t-phase").value);
  if (who) body.assignees = [who];
  act(async () => { const c = await api(R + "/issues", { method: "POST", body }); $("t-title").value = ""; await SK.refresh(); return () => dropTask(c.number); }, "Aufgabe angelegt.");
});

startPage("aufgaben", ["tasks"], render);
</script>
</body>
</html>
