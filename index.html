<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ski Tag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main" hidden>
    <section class="panel">
      <h2>Neue Aufgabe</h2>
      <form class="row" id="f-task">
        <input type="text" id="t-title" class="grow" style="flex:3 1 240px" placeholder="Was ist zu tun?" required aria-label="Aufgabe">
        <select id="t-who" class="grow" aria-label="Wer"></select>
        <select id="t-phase" class="grow" aria-label="Phase"></select>
        <button class="btn" type="submit">Hinzufügen</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Deine Aufgaben</h2><span class="muted small" id="mine-count"></span></div>
      <div id="mine"></div>
    </section>

    <section class="panel">
      <h2>Aufgaben der anderen</h2>
      <div id="others"></div>
      <details class="more" id="done-box" hidden>
        <summary id="done-sum">Erledigt</summary>
        <div id="done"></div>
      </details>
    </section>
  </main>
</div>
<script src="app.js"></script>
<script>
const byEnd = (a, b) => ((taskRange(a) || {}).end || 9e15) - ((taskRange(b) || {}).end || 9e15);

function render() {
  const me = SK.me.login, is = SK.data.issues;
  const open = is.filter(i => i.state === "open"), done = is.filter(i => i.state === "closed");
  const mine = open.filter(isMine).sort(byEnd);
  $("mine-count").textContent = mine.length ? mine.length + " offen" : "";
  $("mine").replaceChildren(...(mine.length ? mine.map(i => taskRow(i)) : [h("p", { class: "empty" }, "Du hast gerade keine offenen Aufgaben.")]));

  const parts = [];
  for (const p of SK.data.people.filter(p => p.login !== me)) {
    const list = open.filter(i => (i.assignees || []).some(a => a.login === p.login)).sort(byEnd);
    if (list.length) parts.push(h("h3", {}, nameOf(p.login)), h("div", {}, ...list.map(i => taskRow(i))));
  }
  const free = open.filter(isFree).sort(byEnd);
  if (free.length) parts.push(h("h3", {}, "Noch niemand zuständig"), h("div", {}, ...free.map(i => taskRow(i))));
  $("others").replaceChildren(...(parts.length ? parts : [h("p", { class: "empty" }, "Keine offenen Aufgaben bei den anderen.")]));

  $("done-box").hidden = !done.length;
  $("done-sum").textContent = "Erledigt (" + done.length + ")";
  $("done").replaceChildren(...done.sort((a, b) => String(b.closed_at).localeCompare(String(a.closed_at))).map(i => taskRow(i)));

  peopleOptions($("t-who"), "Niemand");
  if (!$("t-who").dataset.init) { $("t-who").value = me; $("t-who").dataset.init = "1"; }
  const ph = $("t-phase"), keep = ph.value;
  ph.replaceChildren(...SK.data.milestones.map(m => h("option", { value: m.number }, m.title)));
  if (keep) ph.value = keep;
}

$("f-task").addEventListener("submit", (ev) => {
  ev.preventDefault(); const title = $("t-title").value.trim(); if (!title) return;
  const who = $("t-who").value;
  const body = { title, labels: [CFG.areaOf[who] || "plan"] };
  if ($("t-phase").value) body.milestone = Number($("t-phase").value);
  if (who) body.assignees = [who];
  act(async () => { await api(R + "/issues", { method: "POST", body }); $("t-title").value = ""; await SK.refresh(); }, "Aufgabe angelegt.");
});

startPage("aufgaben", ["tasks"], render);
</script>
</body>
</html>
