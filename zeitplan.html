<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ski Tag">
<title>Zeitplan · Ski Tag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=1793362528">
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main" hidden>
    <section class="panel">
      <div class="panel-head">
        <h2>Zeitplan</h2>
        <button class="btn" type="button" id="new-task">+ Neue Aufgabe</button>
      </div>
      <div class="gantt-scroll"><div class="gantt" id="gantt"></div></div>
      <p class="muted small" style="margin:0">Jede Aufgabe kannst du anklicken und ändern. Abhaken geht unter „Meine Aufgaben“.</p>
    </section>
  </main>
</div>
<script src="app.js?v=1793362528"></script>
<script>
const [R0, R1] = CFG.range;
const pct = (d) => Math.max(0, Math.min(100, (d - R0) / (R1 - R0) * 100));
const addDay = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const PHASE_COLORS = ["--p-blau", "--p-rot", "--sos", "--p-gelb", "--done"];

function renderGantt() {
  const parts = [];
  const months = [];
  for (let d = new Date(R0.getFullYear(), R0.getMonth(), 1); d < R1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(d);
  // Kopf: Monate
  const head = h("div", { class: "g-head", style: "height:26px" });
  months.forEach((d, idx) => {
    const next = new Date(d.getFullYear(), d.getMonth() + 1, 1), l = pct(d < R0 ? R0 : d);
    head.append(h("div", { class: "g-month", style: `left:${l}%;width:${pct(next) - l}%;font-size:13px` },
      d.toLocaleDateString("de-AT", { month: "short" }).replace(".", "") + (d.getMonth() === 0 || idx === 0 ? " " + String(d.getFullYear()).slice(2) : "")));
  });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  parts.push(h("div", {}), head);
  const decorate = (track) => {
    for (const d of months) track.append(h("div", { class: "g-grid", style: `left:${pct(d)}%` }));
    track.append(h("div", { class: "g-today", style: `left:${pct(today)}%`, title: "heute" }));
  };

  // Phasen
  parts.push(h("div", { class: "g-group" }, "Phasen"));
  SK.data.milestones.forEach((m, idx) => {
    const [s, e] = msBounds(m), title = m.title.replace(/^Phase \d+:\s*/, "");
    const list = SK.data.issues.filter(i => i.milestone && i.milestone.number === m.number), done = list.filter(i => i.state === "closed").length;
    parts.push(h("div", { class: "g-label" }, h("span", { class: "t", title: m.title }, (idx + 1) + ". " + title), h("span", { class: "muted small" }, done + " von " + list.length + " erledigt")));
    const track = h("div", { class: "g-track" }); decorate(track);
    const l = pct(s), w = Math.max(1, pct(addDay(e, 1)) - l);
    track.append(h("div", { class: "g-bar", style: `left:${l}%;width:${w}%;--c:var(${PHASE_COLORS[idx % PHASE_COLORS.length]});cursor:default`,
      title: m.title + "\n" + s.toLocaleDateString("de-AT") + " – " + e.toLocaleDateString("de-AT") }, title));
    parts.push(track);
  });

  // pro Person
  const groups = [...SK.data.people.map(p => [nameOf(p.login), SK.data.issues.filter(i => (i.assignees || []).some(a => a.login === p.login))]),
    ["Noch niemand zuständig", SK.data.issues.filter(isFree)]];
  for (const [title, list] of groups) {
    if (!list.length) continue;
    const done = list.filter(i => i.state === "closed").length;
    parts.push(h("div", { class: "g-group" }, title, h("span", { class: "muted small", style: "font-family:var(--font-body);font-weight:500;margin-left:8px" }, done + " von " + list.length + " erledigt")));
    for (const i of [...list].sort((a, b) => ((taskRange(a) || {}).start || 9e15) - ((taskRange(b) || {}).start || 9e15))) {
      const r = taskRange(i), area = areaOfIssue(i), isDone = i.state === "closed";
      const open = () => openEditor(i);
      parts.push(h("div", { class: "g-label" + (isDone ? " done" : ""), onclick: open, title: i.title },
        h("span", { class: "t" }, (isDone ? "✓ " : "") + i.title),
        h("span", { class: "muted small" }, isFree(i) && !isDone
          ? h("button", { class: "link", type: "button", onclick: (e) => { e.stopPropagation(); act(async () => { await takeOver(i); await SK.refresh(); return () => giveBack(i); }, "Übernommen."); } }, "Übernehmen")
          : chip(area))));
      const track = h("div", { class: "g-track" }); decorate(track);
      if (r) {
        const l = pct(r.start), w = Math.max(1, pct(addDay(r.end, 1)) - l);
        track.append(h("button", { type: "button", class: `g-bar a-${area}` + (isDone ? " done" : ""), style: `left:${l}%;width:${w}%`,
          title: `${i.title}\n${r.start.toLocaleDateString("de-AT")} – ${r.end.toLocaleDateString("de-AT")}`, onclick: open }, i.title));
      }
      parts.push(track);
    }
  }
  $("gantt").replaceChildren(...parts);
}

mountEditor();
$("new-task").addEventListener("click", () => openEditor(null));

startPage("zeitplan", ["tasks"], async () => {
  renderGantt();
  refreshEditor();
});
</script>
</body>
</html>
