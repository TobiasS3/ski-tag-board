<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ski Tag">
<title>Zeitplan · Ski Tag Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=1793360426">
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main" hidden>
    <section class="panel editor" id="editor" hidden>
      <h2 id="ed-head">Aufgabe</h2>
      <form class="add" id="f-ed">
        <input type="text" id="ed-title" placeholder="Was ist zu tun?" required aria-label="Titel">
        <div class="row">
          <label class="f">Zuständig<select id="ed-who"></select></label>
          <label class="f">Bereich<select id="ed-area"></select></label>
          <label class="f">Phase<select id="ed-month"></select></label>
        </div>
        <div class="row">
          <label class="f">Von<input type="date" id="ed-start" min="2026-10-26" max="2028-02-29"></label>
          <label class="f">Bis<input type="date" id="ed-end" min="2026-10-26" max="2028-02-29"></label>
          <label class="f" style="flex:0 0 auto">Status<select id="ed-state"><option value="open">offen</option><option value="closed">erledigt</option></select></label>
        </div>
        <textarea id="ed-note" placeholder="Notiz (optional)" aria-label="Notiz"></textarea>
        <div class="row">
          <button class="btn" type="submit">Speichern</button>
          <button class="btn ghost" type="button" id="ed-cancel">Abbrechen</button>
          <span id="ed-extra"></span>
          <span class="muted small">Ohne Datum gilt die ganze Phase.</span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Zeitplan</h2>
        <button class="btn" type="button" id="new-task">+ Neue Aufgabe</button>
      </div>
      <div class="gantt-scroll"><div class="gantt" id="gantt"></div></div>
      <p class="muted small" style="margin:0">Deine eigenen Aufgaben kannst du anklicken und ändern. Abhaken geht unter „Meine Aufgaben“.</p>
    </section>
  </main>
</div>
<script src="app.js?v=1793360426"></script>
<script>
let editing = null;
const [R0, R1] = CFG.range;
const pct = (d) => Math.max(0, Math.min(100, (d - R0) / (R1 - R0) * 100));
const addDay = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const PHASE_COLORS = ["--p-blau", "--p-rot", "--sos", "--p-gelb", "--done"];

function renderGantt() {
  const parts = [];
  const months = [];
  for (let d = new Date(R0.getFullYear(), R0.getMonth(), 1); d < R1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(d);
  // Kopf: Monate
  const head = h("div", { class: "g-head", style: "height:26px" });
  months.forEach((d, idx) => {
    const next = new Date(d.getFullYear(), d.getMonth() + 1, 1), l = pct(d < R0 ? R0 : d);
    head.append(h("div", { class: "g-month", style: `left:${l}%;width:${pct(next) - l}%;font-size:13px` },
      d.toLocaleDateString("de-AT", { month: "short" }).replace(".", "") + (d.getMonth() === 0 || idx === 0 ? " " + String(d.getFullYear()).slice(2) : "")));
  });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  parts.push(h("div", {}), head);
  const decorate = (track) => {
    for (const d of months) track.append(h("div", { class: "g-grid", style: `left:${pct(d)}%` }));
    track.append(h("div", { class: "g-today", style: `left:${pct(today)}%`, title: "heute" }));
  };

  // Phasen
  parts.push(h("div", { class: "g-group" }, "Phasen"));
  SK.data.milestones.forEach((m, idx) => {
    const [s, e] = msBounds(m), title = m.title.replace(/^Phase \d+:\s*/, "");
    const list = SK.data.issues.filter(i => i.milestone && i.milestone.number === m.number), done = list.filter(i => i.state === "closed").length;
    parts.push(h("div", { class: "g-label" }, h("span", { class: "t", title: m.title }, (idx + 1) + ". " + title), h("span", { class: "muted small" }, done + " von " + list.length + " erledigt")));
    const track = h("div", { class: "g-track" }); decorate(track);
    const l = pct(s), w = Math.max(1, pct(addDay(e, 1)) - l);
    track.append(h("div", { class: "g-bar", style: `left:${l}%;width:${w}%;--c:var(${PHASE_COLORS[idx % PHASE_COLORS.length]});cursor:default`,
      title: m.title + "\n" + s.toLocaleDateString("de-AT") + " – " + e.toLocaleDateString("de-AT") }, title));
    parts.push(track);
  });

  // pro Person
  const groups = [...SK.data.people.map(p => [nameOf(p.login), SK.data.issues.filter(i => (i.assignees || []).some(a => a.login === p.login))]),
    ["Noch niemand zuständig", SK.data.issues.filter(isFree)]];
  for (const [title, list] of groups) {
    if (!list.length) continue;
    const done = list.filter(i => i.state === "closed").length;
    parts.push(h("div", { class: "g-group" }, title, h("span", { class: "muted small", style: "font-family:var(--font-body);font-weight:500;margin-left:8px" }, done + " von " + list.length + " erledigt")));
    for (const i of [...list].sort((a, b) => ((taskRange(a) || {}).start || 9e15) - ((taskRange(b) || {}).start || 9e15))) {
      const r = taskRange(i), area = areaOfIssue(i), isDone = i.state === "closed";
      const open = () => openEditor(i);
      parts.push(h("div", { class: "g-label" + (isDone ? " done" : ""), onclick: open, title: i.title },
        h("span", { class: "t" }, (isDone ? "✓ " : "") + i.title),
        h("span", { class: "muted small" }, isFree(i) && !isDone
          ? h("button", { class: "link", type: "button", onclick: (e) => { e.stopPropagation(); act(async () => { await takeOver(i); await SK.refresh(); return () => giveBack(i); }, "Übernommen."); } }, "Übernehmen")
          : chip(area))));
      const track = h("div", { class: "g-track" }); decorate(track);
      if (r) {
        const l = pct(r.start), w = Math.max(1, pct(addDay(r.end, 1)) - l);
        track.append(h("button", { type: "button", class: `g-bar a-${area}` + (isDone ? " done" : ""), style: `left:${l}%;width:${w}%`,
          title: `${i.title}\n${r.start.toLocaleDateString("de-AT")} – ${r.end.toLocaleDateString("de-AT")}`, onclick: open }, i.title));
      }
      parts.push(track);
    }
  }
  $("gantt").replaceChildren(...parts);
}

// ---------- Bearbeiten ----------
function fillEditorSelects() {
  areaOptions($("ed-area"));
  peopleOptions($("ed-who"), "Niemand");
  const ms = $("ed-month"), keep = ms.value;
  ms.replaceChildren(h("option", { value: "auto" }, "Automatisch (nach „Bis“-Datum)"),
    ...SK.data.milestones.map(m => h("option", { value: m.number }, m.title)));
  ms.value = keep || "auto";
}
function openEditor(i) {
  editing = i || null;
  status("");
  fillEditorSelects();
  const r = i ? RANGE_RE.exec(i.body || "") : null;
  $("ed-head").textContent = i ? "Aufgabe ändern" : "Neue Aufgabe";
  $("ed-title").value = i ? i.title : "";
  $("ed-area").value = i ? areaOfIssue(i) : "plan";
  $("ed-who").value = i && i.assignees && i.assignees[0] ? i.assignees[0].login : (i ? "" : SK.me.login);
  $("ed-month").value = i && i.milestone ? String(i.milestone.number) : "auto";
  $("ed-start").value = r ? r[1] : "";
  $("ed-end").value = r ? r[2] : "";
  $("ed-state").value = i ? i.state : "open";
  $("ed-note").value = i ? (i.body || "").replace(RANGE_RE, "").trim() : "";
  // abgeben / löschen wie unter „Meine Aufgaben“
  $("ed-extra").replaceChildren(i ? taskActions(i) : "");
  $("editor").hidden = false;
  $("editor").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  $("ed-title").focus({ preventScroll: true });
}
function milestoneFor(dateStr) {
  const [Y, M, D] = dateStr.split("-").map(Number), d = new Date(Y, M - 1, D);
  const m = SK.data.milestones.find(m => { const [s, e] = msBounds(m); return d >= s && d <= e; });
  return m ? m.number : null;
}
$("f-ed").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const title = $("ed-title").value.trim(); if (!title) return;
  let start = $("ed-start").value, end = $("ed-end").value;
  if (start && !end) end = start;
  if (end && !start) start = end;
  if (start && end && end < start) [start, end] = [end, start];
  let body = $("ed-note").value.trim();
  if (start) body = setRangeInBody(body, start, end);
  const area = $("ed-area").value;
  const otherLabels = editing ? (editing.labels || []).map(l => l.name).filter(n => !AREAS[n]) : [];
  let ms = $("ed-month").value;
  ms = ms === "auto" ? (end ? milestoneFor(end) : (editing && editing.milestone ? editing.milestone.number : null)) : Number(ms);
  const payload = { title, body, labels: [...otherLabels, area], assignees: $("ed-who").value ? [$("ed-who").value] : [], milestone: ms };
  const wasNew = !editing;
  const old = editing;
  act(async () => {
    let undo;
    if (old) {
      if ($("ed-state").value !== old.state) payload.state = $("ed-state").value;
      await api(R + "/issues/" + old.number, { method: "PATCH", body: payload });
      delete SK.data.closers[old.number];
      const before = { title: old.title, body: old.body || "", labels: (old.labels || []).map(l => l.name), assignees: (old.assignees || []).map(a => a.login),
        milestone: old.milestone ? old.milestone.number : null, state: old.state };
      undo = () => api(R + "/issues/" + old.number, { method: "PATCH", body: before });
    } else {
      const created = await api(R + "/issues", { method: "POST", body: payload });
      if ($("ed-state").value === "closed") await api(R + "/issues/" + created.number, { method: "PATCH", body: { state: "closed" } });
      undo = () => dropTask(created.number);
    }
    $("editor").hidden = true; editing = null;
    await SK.refresh();
    return undo;
  }, wasNew ? "Aufgabe angelegt." : "Gespeichert.");
});
$("ed-cancel").addEventListener("click", () => { $("editor").hidden = true; editing = null; });
$("new-task").addEventListener("click", () => openEditor(null));

startPage("zeitplan", ["tasks"], async () => {
  if (editing) { const now = SK.data.issues.find(x => x.number === editing.number); if (!now) { $("editor").hidden = true; editing = null; } }
  renderGantt();
  if (!$("editor").hidden) { const keep = { area: $("ed-area").value, who: $("ed-who").value, month: $("ed-month").value }; fillEditorSelects(); $("ed-area").value = keep.area; $("ed-who").value = keep.who; $("ed-month").value = keep.month; }
});
</script>
</body>
</html>
